<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="344" viewBox="0 0 1200 344" role="img" aria-labelledby="ledTitle ledDesc">
  <title id="ledTitle">一次运行留下的批次目录与主日志</title>
  <desc id="ledDesc">左侧是批次目录结构：计划、计划审查、测试报告、日志与最终报告。右侧是主智能体日志片段，记录了任务启动、开发完成、测试通过、任务完成与提交哈希。</desc>

